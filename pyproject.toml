[project]
name = "CRNNondim"
version = "1.0.0"
description = "CRNNondim library main repository"
authors = [{ name = "Georgio Hawi", email = "georgio.hawi@sydney.edu.au" },
{name = "Martin Wechselberger", email = "martin.wechselberger@sydney.edu.au"}]
requires-python = ">=3.11.7,<3.13"
readme = "README.md"
license = "MIT"
keywords = [
    "polynomial dynamical system",
    "CRN",
    "non-dimensionalisation",
]
dependencies = [
    "numpy>=1.26.4,<2",
    "scipy>=1.14.0,<2",
    "sympy>=1.13.1,<2",
]

[project.urls]
Homepage = "https://github.com/georgio-hawi/crnnondim"
Repository = "https://github.com/georgio-hawi/crnnondim"

[tool.hatch.build.targets.sdist]
include = [
    "src/crnnondim",
    "examples",
    "full_example.py",
    "CITATION.cff",
    "LICENSE",
    "README.md",
]
exclude = [
    "/tests",
    "/out",
    "/.git",
    "/.github",
    "*.pkl",
    "*.pyc",
]

[tool.hatch.build.targets.wheel]
include = ["src/crnnondim"]

[tool.hatch.build.targets.wheel.sources]
"src/crnnondim" = "crnnondim"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"